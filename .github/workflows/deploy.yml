# Build the Jupyter Book and deploy it to GitHub Pages.
# Requires: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and deploy book

on:
  push:
    branches: [main]
  pull_request:          # build only (no deploy) to catch errors before merging
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build HTML
        working-directory: book
        env:
          # project site: https://dracor-org.github.io/dracor-tech-reports/
          BASE_URL: /${{ github.event.repository.name }}
        # no --execute: the report editions show code with its original output
        run: jupyter-book build --html
      - name: Redirects from the old report URLs (/reports/d7-N/...)
        run: python tools/make_redirects.py book/_build/html "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
